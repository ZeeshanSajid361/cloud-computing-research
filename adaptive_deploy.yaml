apiVersion: apps/v1
kind: Deployment
metadata:
  name: primary-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-primary
  template:
    metadata:
      labels:
        app: edge-primary
    spec:
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: shared-data
        - name: app-script
          configMap:
            name: app-script
        - name: adaptive-script
          configMap:
            name: adaptive-script
      containers:
        - name: state-generator
          image: python:3.9-slim
          command: ["python", "-u", "/app.py"]
          volumeMounts:
            - name: shared-storage
              mountPath: /data
            - name: app-script
              mountPath: /app.py
              subPath: app.py
              readOnly: true
        - name: sync-agent
          image: python:3.9-slim
          command: ["python", "-u", "/adaptive_sync.py"]
          volumeMounts:
            - name: shared-storage
              mountPath: /shared-volume
            - name: shared-storage
              mountPath: /data
            - name: adaptive-script
              mountPath: /adaptive_sync.py
              subPath: adaptive_sync.py
              readOnly: true