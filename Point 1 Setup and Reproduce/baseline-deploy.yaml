apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primary-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-primary
  template:
    metadata:
      labels:
        app: edge-primary
    spec:
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: shared-data
        - name: app-script
          configMap:
            name: app-script
        - name: sync-script
          configMap:
            name: sync-script
      containers:
        - name: state-generator
          image: python:3.9-slim
          command: ["python", "/app.py"]
          volumeMounts:
            - name: shared-storage
              mountPath: /data
            - name: app-script
              mountPath: /app.py
              subPath: app.py
              readOnly: true
        - name: sync-agent
          image: busybox
          command: ["/bin/sh", "/sync.sh"]
          volumeMounts:
            - name: shared-storage
              mountPath: /shared-volume
            - name: shared-storage
              mountPath: /data
            - name: sync-script
              mountPath: /sync.sh
              subPath: sync.sh
              readOnly: true